  <p class="muted">${netKind()==='room'?'Friends open this same game page on their own device, choose <b>Play online with friends</b> and type the code. Share the page with them first, with Contributor or Editor access.':'Friends open their own copy of this game file, choose <b>Play online with friends</b> and type the code.'}</p>
  <h4 class="mh">FORMAT</h4>${fmtPicker()}`:`<p class="lede">Table <b>${esc(NET.code)}</b> · ${esc(F.label)}. ${esc(F.blurb)}</p>`}
 <h4 class="mh">SEATS · ${humans} PLAYER${humans===1?'':'S'}, ${L.seats.length-humans} COMPUTER${L.seats.length-humans===1?'':'S'}</h4>

// ---------- timers ----------
function netTick(){
 if(!NET.tx)return; const now=Date.now();
 if(NET.role==='host'){
  if(NET.stage==='lobby')raw(lobbyMsg());
  raw({k:'hb',host:true,top:NET.log.length});
  for(const [cid,g] of Object.entries(NET.guests)){
   const quiet=now-g.last;
   if(NET.stage==='lobby'&&quiet>12000)dropGuest(cid);
   else if(NET.stage==='game'&&quiet>35000)dropGuest(cid);
   else if(NET.stage==='game'&&g.ack<NET.log.length)for(const e of NET.log.slice(g.ack,g.ack+8))raw({k:'e',host:true,ep:NET.ep,s:e.s,e});
  }
 } else {
  if(NET.stage==='lobby')sendHello();
  raw({k:'hb',ack:NET.recv,ep:NET.ep});
  if(NET.wait&&now-NET.wait>9000){NET.wait=0;if(!NET.pumping){RUN.busy=false;if(G)render();}}
  for(const m of NET.out.slice(0,6))raw({k:'int',n:m.n,a:m.a});
  if(NET.hostCid&&now-NET.lastHost>40000)return hostGone();
  if(!NET.hostCid&&now-NET.startedAt>15000&&!NET.err)netSay('Still looking for that table. Check the code with the host and make sure their table is open.',true);
 }
}
function dropGuest(cid){
 const g=NET.guests[cid]; if(!g)return; delete NET.guests[cid];
 if(NET.stage==='lobby'){NET.lobby.seats=NET.lobby.seats.map(s=>s.cid===cid?{cid:null}:s);castLobby();}
 else if(NET.stage==='game'){NET.drops.push(cid);hostStep();}
}

// ---------- receiving ----------
function netRecv(p){
 if(!p||typeof p!=='object'||!p.from||p.from===NET.cid)return;
 if(p.to&&p.to!==NET.cid)return;
 if(NET.role==='host')return hostRecv(p);
 if(NET.role==='guest')return guestRecv(p);
}
function hostRecv(p){
 if(p.host)return;                                  // another host on the same code: ignore
 const cid=String(p.from).slice(0,24), now=Date.now();
 if(p.k==='hello'){
  if(p.v!==NETV)return raw({k:'full',to:cid,why:'version'});
  let g=NET.guests[cid];
  if(NET.stage==='game'){if(!g)raw({k:'full',to:cid,why:'started'});else g.last=now;return;}
  if(!g)g=NET.guests[cid]={last:now,ack:0,intN:0};
  g.last=now;
  const name=cleanName(p.name,'Friend'), fac=FACTIONS[p.fac]?p.fac:'random';
  let s=NET.lobby.seats.find(x=>x.cid===cid);
  if(!s){const free=NET.lobby.seats.findIndex(x=>!x.cid);if(free<0)return raw({k:'full',to:cid,why:'full'});s=NET.lobby.seats[free]={cid,name,fac};castLobby();}
  else if(s.name!==name||s.fac!==fac){s.name=name;s.fac=fac;castLobby();}
  return;
 }
 const g=NET.guests[cid]; if(!g)return;
 g.last=now;
 if(p.k==='hb'){if(typeof p.ack==='number'&&p.ep===NET.ep)g.ack=Math.max(g.ack,Math.min(p.ack,NET.log.length));return;}
 if(p.k==='bye')return dropGuest(cid);
 if(p.k==='int'&&typeof p.n==='number'&&p.a&&typeof p.a==='object'){
  raw({k:'iack',to:cid,n:p.n});
  if(p.n<=g.intN)return; g.intN=p.n;
  NET.ints.push({cid,a:p.a}); hostStep();
 }
}
function guestRecv(p){
 if(!p.host&&p.k!=='full'&&p.k!=='iack'&&p.k!=='bye')return;
 if(p.k==='full'){if(NET.stage==='lobby')netSay(p.why==='started'?'That match has already started. Ask the host for a new table.':p.why==='version'?'The host has a different version of the game. Reload the page (or use the same game file).':'That table is full. Ask the host to pick a bigger format.',true);return;}
 if(NET.hostCid&&p.from!==NET.hostCid)return;
 if(p.k==='lobby'){
  if(p.v!==NETV)return netSay('The host has a different version of the game. Reload the page (or use the same game file).',true);
  if(!FORMATS[p.format]||!Array.isArray(p.seats))return;
  NET.hostCid=p.from; NET.lastHost=Date.now();
  NET.lobby={format:p.format,seats:p.seats.slice(0,8).map(s=>s&&s.cid?{cid:String(s.cid),name:cleanName(s.name,'Player'),fac:FACTIONS[s.fac]?s.fac:'random'}:{cid:null})};
  if(NET.stage==='game'&&p.back){NET.stage='lobby';NET.log=[];NET.recv=0;NET.buf={};NET.q=[];NET.out=[];RUN.token++;ONLINE=false;showLobby();}
  if(NET.stage==='lobby'){if(NET.lobby.seats.some(s=>s.cid===NET.cid)&&!NET.err)netSay('You are seated. Waiting for the host to start…');refreshLobby();}
  return;
 }
 if(!NET.hostCid)return;
 NET.lastHost=Date.now();
 if(p.k==='bye')return hostGone();
 if(p.k==='iack'){NET.out=NET.out.filter(m=>m.n>p.n);return;}
 if(p.k==='hb'){return;}
 if(p.k==='e'&&typeof p.s==='number'&&p.e&&typeof p.e==='object'){
  if(p.ep!==NET.ep){NET.ep=p.ep;NET.recv=0;NET.buf={};NET.q=[];}          // a new match from the host: start its log from the top
  if(p.s>NET.recv&&p.s<NET.recv+400){NET.buf[p.s]=p.e;
   while(NET.buf[NET.recv+1]){const e=NET.buf[NET.recv+1];delete NET.buf[NET.recv+1];NET.recv++;NET.q.push(e);}
   pump();}
 }
}

// ---------- the shared log ----------
function pushEntry(e){
 if(NET.role!=='host')return;
 if(e.t!=='start'&&G)e.h=stateHash(G);
 e.s=NET.log.length+1; NET.log.push(e);
 raw({k:'e',host:true,ep:NET.ep,s:e.s,e});
 NET.q.push(e); pump();
}
// a move from the person at this device
function netAct(a){
 if(NET.role==='host')return pushEntry(a);
 const m={n:++NET.n,a}; NET.out.push(m); NET.wait=Date.now(); raw({k:'int',n:m.n,a});
}
const seatCid=pid=>NET.lobby&&NET.lobby.seats[pid]?NET.lobby.seats[pid].cid:null;
function hostStart(){
 if(NET.role!=='host'||!NET.lobby)return;
 readSettings();
 const L=NET.lobby, facs=Object.keys(FACTIONS), rnd=()=>facs[Math.floor(Math.random()*facs.length)];
 NET.stage='game'; NET.ep++; NET.log=[]; NET.q=[]; NET.ints=[]; NET.drops=[]; NET.desync=false;
 for(const g of Object.values(NET.guests)){g.ack=0;}
 const cfg={}; for(const k of Object.keys(DEFAULTS))if(k!=='format')cfg[k]=CFG[k];
 pushEntry({t:'start',v:NETV,seed:(Math.random()*2147483646|0)+1,format:L.format,cfg,seats:L.seats.map(s=>s.cid?{cid:s.cid,name:cleanName(s.name,'Player'),fac:FACTIONS[s.fac]?s.fac:rnd()}:{cid:null,fac:rnd()})});
}
function flagDesync(){if(NET.desync)return;NET.desync=true;setNetPill();addLog('Warning: this table no longer matches the host’s. Finish the round, then ask the host to start a new match.','var(--ember)',true);}
async function applyEntry(e){
 if(e.t==='start'){
  if(!FORMATS[e.format]||!Array.isArray(e.seats))return;
  RUN.token++; resetTable(); NET.stage='game'; NET.desync=false; NET.out=[];
  NET.lobby={format:e.format,seats:e.seats.map(s=>s.cid?{cid:s.cid,name:s.name,fac:s.fac}:{cid:null})};
  const keep=CFG; CFG={...DEFAULTS,...(e.cfg||{}),format:e.format};
  const humans=[], names={}, factions=[];
  e.seats.forEach((s,i)=>{factions[i]=s.fac;if(s.cid){humans.push(i);names[i]=cleanName(s.name,'Player');}});
  try{G=newGame({seed:e.seed,format:e.format,humans,names,factions});}finally{CFG=keep;}
  const mine=e.seats.findIndex(s=>s.cid===NET.cid);
  HUMAN=mine>=0?mine:null; ONLINE=true; MODE='online';
  closeOverlay(); renderCtrls(); setNetPill();
  addLog(`An online match begins: ${FORMATS[e.format].label}.`,'var(--muted)');
  if(HUMAN!=null)addLog(solo()?`You lead ${FACTIONS[G.players[HUMAN].faction].name}.`:`You lead ${FACTIONS[G.players[HUMAN].faction].name} on team ${G.teams[G.players[HUMAN].team].name}, with ${G.teams[G.players[HUMAN].team].pids.filter(x=>x!==HUMAN).map(x=>G.players[x].name).join(' and ')} as your partner.`,'var(--muted)');
  if(G.phase==='play')afterRedraw(); else render();
  return;
 }
 if(!G||!ONLINE)return;
 if(e.h&&e.h!==stateHash(G))flagDesync();
 if(e.pid===HUMAN)NET.wait=0;
 const tok=RUN.token;
 if(e.t==='redraw'){
  const r=redrawCard(G,e.pid,e.uid); if(!r)return;
  if(e.pid===HUMAN){FRESH=new Set([r.inn.uid]);addLog(`You swap ${r.out.name} for ${r.inn.name}.`,'var(--muted)');}
  else addLog(`${G.players[e.pid].name} swaps a card.`,'var(--muted)');
  if(G.phase==='play')afterRedraw(); else render(); return;
 }
 if(e.t==='rdone'){const p=G.players[e.pid];if(G.phase!=='redraw'||!p||p.ready)return;redrawDone(G,e.pid);if(G.phase==='play')afterRedraw();else render();return;}
 if(e.t==='ai'){const p=G.players[e.pid];if(!p||p.ai)return;p.ai=true;if(!p.ready)redrawDone(G,e.pid);addLog(`${p.name} left the table. The computer takes over that seat.`,'var(--ember)',true);if(G.phase==='play'&&!G.over&&G.round===1&&!G.players.some(q=>q.roundPlays)&&!LOG.some(l=>/opens round 1|Focus order/.test(l.text)))afterRedraw();else render();return;}
 if(e.t==='act'){
  if(G.over||G.phase!=='play'||current(G).id!==e.pid){flagDesync();return;}
  const a=unpackAct(e.pid,e.a); if(!a){flagDesync();return;}
  sel=null; LMODE=null;
  await commit(e.pid,a,tok);
  while(G&&!G.over&&tok===RUN.token&&current(G).passed){if(!nextTurn(G))await finishRound(tok);}
 }
}
async function pump(){
 if(NET.pumping)return; NET.pumping=true; RUN.busy=true;
 try{while(NET.q.length){const e=NET.q.shift();try{await applyEntry(e);}catch(err){console.error(err);flagDesync();}}}
 finally{NET.pumping=false;}
 RUN.busy=NET.role==='guest'&&!!NET.wait;
 if(G&&ONLINE)render();
 hostStep();
}
// the host turns waiting moves into log entries, one at a time, only when its own table is settled
function hostStep(){
 if(NET.role!=='host'||NET.stage!=='game'||NET.pumping||NET.q.length||!G||!ONLINE)return;
 if(NET.drops.length){
  const cid=NET.drops.shift(); const pids=NET.lobby.seats.map((s,i)=>s.cid===cid?i:-1).filter(i=>i>=0&&G.players[i]&&!G.players[i].ai);
  NET.lobby.seats=NET.lobby.seats.map(s=>s.cid===cid?{cid:null}:s); NET.ints=NET.ints.filter(x=>x.cid!==cid);
  if(pids.length)return pids.forEach(pid=>pushEntry({t:'ai',pid}));
  return hostStep();
 }
 if(G.over)return;
 if(G.phase==='redraw'){
  const i=NET.ints.findIndex(x=>(x.a.t==='redraw'||x.a.t==='rdone')&&seatCid(x.a.pid)===x.cid&&G.players[x.a.pid]&&!G.players[x.a.pid].ready);
  NET.ints=NET.ints.filter((x,k)=>k===i||x.a.t==='redraw'||x.a.t==='rdone');
  if(i>=0){const it=NET.ints.splice(i,1)[0];pushEntry(it.a.t==='redraw'?{t:'redraw',pid:it.a.pid,uid:+it.a.uid}:{t:'rdone',pid:it.a.pid});}
  return;
 }
 const p=current(G);
 if(p.passed)return;
 if(p.ai)return pushEntry({t:'act',pid:p.id,a:packAct(aiDecide(G,p.id))});
 const i=NET.ints.findIndex(x=>x.a.t==='act'&&x.a.pid===p.id&&seatCid(p.id)===x.cid);
 const it=i>=0?NET.ints[i]:null; NET.ints=[];
 if(it&&unpackAct(p.id,it.a.a))pushEntry({t:'act',pid:p.id,a:it.a.a});
}

 if(el.closest('#mOnline')){showOnline();return true;}
 if(el.closest('#hostBtn')){readMe();hostOpen(genCode());return true;}
 if(el.closest('#copyCode')){const b=$('#copyCode');try{navigator.clipboard.writeText(NET.code).then(()=>{b.textContent='Copied';},()=>{});}catch(e){}return true;}
 if(el.closest('#netStart')){readMe();hostStart();return true;}
 if(el.closest('#netAgain')){if(NET.role==='host'&&G&&G.over)hostStart();return true;}
 if(el.closest('#netLobby')){if(NET.role==='host'){NET.stage='lobby';RUN.token++;ONLINE=false;NET.log=[];NET.q=[];showLobby();raw(lobbyMsg({back:true}));}return true;}
 if(el.closest('#leaveNet')||el.closest('#confirmLeave')){netLeave();RUN.token++;G=null;HUMAN=null;render();renderCtrls();showMenu();return true;}
 if(el.closest('#stayBtn')){closeOverlay();return true;}
 const st=el.closest('[data-seat]');
 if(st&&NET.role==='host'&&NET.stage==='lobby'){
  const i=+st.dataset.seat;
  if(NET.pick==null)NET.pick=i; else{const a=NET.lobby.seats[NET.pick];NET.lobby.seats[NET.pick]=NET.lobby.seats[i];NET.lobby.seats[i]=a;NET.pick=null;}
  castLobby(); return true;
 }
 return false;
}

let CODEX={fac:null,filter:'all',card:null,from:'menu',wasPaused:false};
const codexFacs=()=>[...Object.keys(FACTIONS),'neutral'];
const facColor=f=>f==='neutral'?NEUTRAL_COLOR:FACTIONS[f].color;
const facName=f=>f==='neutral'?'Neutral cards':FACTIONS[f].name;
const deckList=f=>f==='neutral'?NEUTRAL:DECKS[f];
const PERK_CLASSIC={thorn:'your rival has to open round 1, which is the weaker seat.',brood:'you keep your weakest non-hero unit, and only after a round you did not win.',aureth:'a 0–0 round is still a draw.',gild:'you start with 3 coins.',sun:'the bonus applies in any round that can end the match.',valmark:'you draw 1 card after each round you win.'};
const AB2NAME={stormborn:'Storm-born',raider:'Transforms',profit:'Profit',fee:'Fee',ascend:'Ascend',lens:'Burn, Ranged',veiled:'Veiled'};
function deckStats(f){
 let n=0,heroes=0,str=0,spec=0; const rows={melee:0,ranged:0,siege:0,agile:0};
 for(const [k,c] of deckList(f)){const d=DEF[k];n+=c;if(d.hero)heroes+=c;if(d.type==='unit'){rows[d.row]+=c;str+=d.str*c;}else spec+=c;}
 return {n,heroes,str,spec,rows};
}
const uniqueCards=()=>new Set([...Object.values(DECKS).flat().map(x=>x[0]),...NEUTRAL.map(x=>x[0])]).size;
function cxMatches(d,flt){
 if(flt==='all')return true; if(flt==='hero')return !!d.hero; if(flt==='special')return d.type!=='unit';
 return d.type==='unit'&&d.row===flt;
}
function cxShort(d){
 if(d.type!=='unit')return d.type==='weather'?'Weather':{relic:'Relic',rite:'Transforms raiders',contract:'Fee 4'}[d.type]||'Special';
 if(d.hidden)return 'Hidden';
 const ab=d.ab?{spy:'Spy',medic:'Medic',muster:'Muster',bond:'Tight Bond',morale:'Morale Boost',horn:'Horn',scorchMelee:'Scorch, Melee'}[d.ab]:'';
 const ab2=d.ab2&&AB2NAME[d.ab2]?AB2NAME[d.ab2]+(d.ab2==='profit'?' '+(d.profit==='dice'?'1–4':d.profit):d.ab2==='fee'?' '+d.fee:''):'';
 return [d.hero?'Hero':'',d.token?'Token':'',ab,ab2,d.drain?'Drain '+d.drain:'',d.row==='agile'?'Agile':''].filter(Boolean).join(' · ')||'No ability';
}
function cxWhere(d){
 if(d.hidden)return 'Shown in the row it was played to.';
 if(d.type!=='unit')return d.type==='weather'?`Goes in the weather slot and hits the ${ROWNAME[d.wrow]} rows of every team.`:d.type==='horn'||d.type==='relic'?'Goes in the horn slot of one of your team’s rows.':d.type==='rite'?'Played on one of your team’s rows that has a Young Raider.':d.type==='contract'?'Played on a rival team’s unit.':'Played straight from your hand.';
 if(d.token)return d.key==='storm_berserker'?'Replaces a Young Raider in its row.':'Goes in any of your team’s rows.';
 if(d.ab==='spy')return `Goes in the ${ROWNAME[d.row]} row of an opposing team you choose.`;
 return d.row==='agile'?'Goes in your team’s Melee or Ranged row — your choice.':`Goes in your team’s ${ROWNAME[d.row]} row.`;
}
// ---------- hover popup: one proper card with its description underneath ----------
function popHTML(d,o={}){
 const neutral=d.fac==='neutral'||!FACTIONS[d.fac];
 const col=neutral?NEUTRAL_COLOR:FACTIONS[d.fac].color, fac=neutral?'Neutral':FACTIONS[d.fac].name;
 const unit=d.type==='unit', v=d.hidden?'?':o.val!=null?o.val:d.str, badge=d.ab||(d.ab2==='raider'?'rite':d.ab2)||(unit?null:d.icon);
 const kind=d.hidden?'Hidden card':unit?`${ROWNAME[d.row]} unit${d.hero?' · Hero':''}${d.token?' · Token':''}`:d.type==='weather'?'Weather':'Special';
 const text=unit?cardText(d):(SPEC_NEW[d.key]||SPEC3[d.key]||d.text||'');
 const sc=o.val!=null&&o.val>d.str?'buff':o.val!=null&&o.val<d.str?'nerf':'';
 const notes=[];
 if(o.where)notes.push(`<p class="pop-where">${svg(unit?(d.row==='agile'?'agile':d.row):(d.icon||'neutral'))}<span>${esc(o.where)}</span></p>`);
 if(o.val!=null&&o.val!==d.str)notes.push(`<p class="pop-note">On the board right now: <b>${o.val}</b> (printed ${d.str}).</p>`);
 if(o.owner)notes.push(`<p class="pop-note">${esc(o.owner)}</p>`);
 return `<div class="pop ${d.hero?'hero':''}" style="--fc:${col}"><div class="pop-art"><svg viewBox="0 0 100 140" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><use href="#art-${d.key}"/></svg>${unit||d.type==='decoy'?`<span class="pop-str ${d.hero?'hero':''} ${sc}">${v}</span>`:''}${badge?`<span class="pop-ab">${svg(badge)}</span>`:''}${unit&&!d.hidden?`<span class="pop-row" title="${ROWNAME[d.row]}">${svg(d.row)}</span>`:''}${o.copies>1?`<span class="pop-x">×${o.copies} in the deck</span>`:''}</div><div class="pop-body"><h3>${esc(d.name)}</h3><div class="pop-sub">${esc(fac).toUpperCase()} · ${kind.toUpperCase()}${unit&&!d.hidden?' · STRENGTH '+d.str:''}</div>${d.flavor?`<p class="pop-flavor">${esc(d.flavor)}</p>`:''}<p class="pop-text">${esc(text)}</p>${notes.join('')}</div></div>`;
}
let POPKEY=null;
function showPop(p){const el=$('#cardPop');if(!el||!p)return;if(POPKEY===p.key&&!el.hidden)return;POPKEY=p.key;el.innerHTML=p.html;el.hidden=false;}
function hidePop(){const el=$('#cardPop');POPKEY=null;if(el&&!el.hidden){el.hidden=true;el.innerHTML='';}}
// what to show for the element under the pointer (a library tile, or a card in a match)
function popFor(el){
 if(!el||!el.closest)return null;
 const tile=el.closest('.cx-card');
 if(tile){const k=tile.dataset.cxcard,d=DEF[k];if(!d)return null;const e=(deckList(CODEX.fac==='rules'?'neutral':CODEX.fac)||[]).find(x=>x[0]===k);return {key:'cx:'+k,html:popHTML(d,{copies:e?e[1]:1,where:cxWhere(d)})};}
 const c=el.closest('.card[data-uid]');
 if(!c||c.closest('#cardPop')||c.closest('#toast')||c.closest('.cx-card'))return null;
 const uid=+c.dataset.uid; if(!G||isNaN(uid))return null;
 let card=findCard(uid); if(!card&&HUMAN!=null)card=G.players[HUMAN].discard.find(x=>x.uid===uid); if(!card)return null;
 const hti=G.teams.findIndex(t=>ROWS.some(r=>t.side.rows[r].some(y=>y.uid===uid)));
 if(hti>=0&&hiddenFor(card,hti)){const op=G.players[card.owner];return {key:'g:h'+uid,html:popHTML(DEF.veil_back,{owner:op?`Played by ${op.name} (${G.teams[op.team].name}). Revealed when the round ends.`:null})};}
 let val=null;
 for(const t of G.teams)for(const r of ROWS)if(t.side.rows[r].some(y=>y.uid===uid))val=rowCalc(G,t.i,r).vals[uid];
 const op=card.owner!=null&&G.players[card.owner];
 const owner=op&&val!=null?`Played by ${op.ai?op.name:'you'} (${G.teams[op.team].name})${card.spyFrom!=null?' as a spy':''}.`:null;
 const inHand=HUMAN!=null&&G.players[HUMAN].hand.some(x=>x.uid===uid);
 return {key:'g:'+uid+':'+val,html:popHTML(card,{val:val!=null&&card.type==='unit'?val:null,owner,where:inHand?cxWhere(card):null})};
}
const HOVER=(()=>{try{return window.matchMedia('(hover:hover) and (pointer:fine)').matches;}catch(e){return true;}})();
let MX=-1,MY=-1;
document.addEventListener('mousemove',e=>{MX=e.clientX;MY=e.clientY;},{passive:true});
document.addEventListener('mouseover',e=>{if(!HOVER)return;MX=e.clientX;MY=e.clientY;const p=popFor(e.target);if(p)showPop(p);else hidePop();});
document.addEventListener('mouseout',e=>{if(!e.relatedTarget)hidePop();});
// after a scroll, show whatever card is now under the pointer (or nothing)
let SCROLLRAF=0;
document.addEventListener('scroll',()=>{if(!HOVER||SCROLLRAF)return;SCROLLRAF=requestAnimationFrame(()=>{SCROLLRAF=0;if(MX<0)return hidePop();const p=popFor(document.elementFromPoint(MX,MY));if(p)showPop(p);else hidePop();});},true);
function cxDeck(f){

 const facCards=f!=='neutral';

  .map(([k,l])=>`<button class="cx-chip ${CODEX.filter===k?'on':''}" data-cxfilter="${k}" aria-pressed="${CODEX.filter===k}">${l}</button>`).join('');

  lead=`<div class="cx-boxes"><div class="cx-box"><span class="k">FACTION PERK</span><p>${esc(PERK3[f])}</p>${PERK_CLASSIC[f]?`<p class="muted">In Classic 1v1: ${esc(PERK_CLASSIC[f])}</p>`:''}</div>

 }

 const rows=facCards?`<span class="cx-stat"><b>${st.n}</b> faction cards + 13 neutral = <b>${st.n+13}</b> in the deck</span>`:`<span class="cx-stat"><b>${st.n}</b> cards, added to every deck</span>`;
 return `<div class="cx-head" style="--fc:${facColor(f)}"><span class="cx-sig">${svg(f==='neutral'?'neutral':f)}</span><div><span class="k">${esc(B.tag).toUpperCase()}</span><h3>${esc(facName(f))}</h3><p>${esc(B.text)}</p></div></div>
 <div class="cx-stats">${rows}<span class="cx-stat"><b>${st.heroes}</b> heroes</span><span class="cx-stat">${svg('melee')}<b>${st.rows.melee}</b> Melee</span><span class="cx-stat">${svg('ranged')}<b>${st.rows.ranged}</b> Ranged</span><span class="cx-stat">${svg('siege')}<b>${st.rows.siege}</b> Siege</span>${st.rows.agile?`<span class="cx-stat">${svg('agile')}<b>${st.rows.agile}</b> Agile</span>`:''}${st.spec?`<span class="cx-stat"><b>${st.spec}</b> special</span>`:''}<span class="cx-stat">Total unit strength <b>${st.str}</b></span></div>
 ${lead}
 <p class="cx-tip"><b>How it plays:</b> ${esc(B.tip)}</p>
 <div class="cx-chips" role="group" aria-label="Filter cards">${chips}</div>
 <div class="cx-grid">${list.map(([k,c])=>cxTile(k,c)).join('')||'<p class="muted">No cards match this filter.</p>'}</div>${tok}`;
}
function cxTile(k,c,extra){const d=DEF[k];return `<div class="cx-card ${extra?'extra':''}" data-cxcard="${k}" role="button" tabindex="0" aria-label="${esc(d.name)}, ${c} ${c>1?'copies':'copy'}"><span class="cx-art">${cardHTML(d,{ro:true})}${c>1?`<span class="cx-x">×${c}</span>`:''}</span><span class="cx-nm">${esc(d.name)}</span><span class="cx-meta">${d.hidden?'Hidden':d.type==='unit'?`${svg(d.row)}${ROWNAME[d.row]} · ${d.str}`:esc(d.type==='weather'?'Weather':'Special')}</span><span class="cx-ab">${esc(cxShort(d))}</span></div>`;}

}
function showCodex(fac){
 CODEX.from=G&&!G.over?'game':'menu';
 if(CODEX.from==='game'&&HUMAN==null){CODEX.wasPaused=RUN.paused;RUN.paused=true;}
 if(fac)CODEX.fac=fac; if(!CODEX.fac)CODEX.fac=Object.keys(FACTIONS)[0];
 openOverlay(codexHTML(),'codex');
}
function refreshCodex(){hidePop();const m=document.querySelector('#overlay .modal.codex');if(!m)return;const sc=($('#cxMain')||{}).scrollTop||0;m.innerHTML=codexHTML();if(CODEX.keepScroll&&$('#cxMain'))$('#cxMain').scrollTop=sc;CODEX.keepScroll=false;}
function closeCodex(){
 if(CODEX.from==='game'){closeOverlay();if(HUMAN==null){RUN.paused=CODEX.wasPaused;renderCtrls();}}
 else showMenu();
}
document.addEventListener('click',e=>{
 const el=e.target;
 if(el.closest('#openCodex')||el.closest('#decksBtn'))return showCodex();
 if(!document.querySelector('#overlay .modal.codex'))return;
 hidePop();
 if(el.closest('#cxClose'))return closeCodex();
 const f=el.closest('[data-cxfac]'); if(f){CODEX.fac=f.dataset.cxfac;CODEX.filter='all';CODEX.card=null;return refreshCodex();}
 const fl=el.closest('[data-cxfilter]'); if(fl){CODEX.filter=fl.dataset.cxfilter;CODEX.card=null;return refreshCodex();}
 const c=el.closest('[data-cxcard]'); if(c){const p=popFor(c);if(POPKEY===p.key&&!HOVER)return hidePop();return showPop(p);}
});
document.addEventListener('focusin',e=>{const t=e.target.closest&&e.target.closest('.cx-card');if(t)showPop(popFor(t));});
document.addEventListener('focusout',e=>{if(e.target.closest&&e.target.closest('.cx-card'))hidePop();});
document.addEventListener('keydown',e=>{if(!document.querySelector('#overlay .modal.codex'))return;if(e.key==='Escape')closeCodex();else if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.cx-card')){e.preventDefault();e.target.click();}});

boot();

</script>
</body>
</html>
